name: Android foundation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      baseline: ${{ steps.classify.outputs.baseline }}
      containment: ${{ steps.classify.outputs.containment }}
      network: ${{ steps.classify.outputs.network }}
      managed: ${{ steps.classify.outputs.managed }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE_SHA: ${{ github.event.before }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          # Fail safe: retain these broad defaults unless detection and
          # classification both complete successfully.
          printf '%s\n' \
            'baseline=true' \
            'containment=true' \
            'network=true' \
            'managed=true' >> "$GITHUB_OUTPUT"

          case "$EVENT_NAME" in
            pull_request) base_sha=$PR_BASE_SHA ;;
            push) base_sha=$EVENT_BEFORE_SHA ;;
            *)
              echo 'CI_CHANGESET baseline=true containment=true network=true managed=true (unexpected event)'
              exit 0
              ;;
          esac

          sha_pattern='^[0-9a-f]{40}$'
          if ! [[ "$base_sha" =~ $sha_pattern && "$TESTED_SHA" =~ $sha_pattern ]] ||
             [[ "$base_sha" == 0000000000000000000000000000000000000000 ]]; then
            echo 'CI_CHANGESET baseline=true containment=true network=true managed=true (unresolved comparison)'
            exit 0
          fi

          changed_files=$(mktemp)
          if ! git diff --name-only --diff-filter=ACDMRTUXB "$base_sha" "$TESTED_SHA" > "$changed_files"; then
            echo 'CI_CHANGESET baseline=true containment=true network=true managed=true (diff failed)'
            exit 0
          fi

          cat "$changed_files"
          classification=$(mktemp)
          if ! .github/scripts/classify-ci-changes.sh < "$changed_files" > "$classification"; then
            echo 'CI_CHANGESET baseline=true containment=true network=true managed=true (classification failed)'
            exit 0
          fi
          tee -a "$GITHUB_OUTPUT" < "$classification"

  validate:
    needs: changes
    if: needs.changes.outputs.baseline == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Test independent capture analyzer
        run: python3 android/tools/test-network-evidence.py
      - name: Test managed-profile evidence classifier
        run: python3 android/tools/test-managed-profile-evidence.py
      - name: Verify wrapper JAR
        run: echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check
        working-directory: android
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"'
      - name: Lint, unit-test task, and debug build
        run: >-
          ./gradlew --no-daemon
          :app:lintDebug
          :app:testDebugUnitTest
          :app:assembleDebug
          :probe-app:lintDebug
          :probe-app:testDebugUnitTest
          :probe-app:assembleDebug
          :research-native:lintDebug
          :research-native:testDebugUnitTest
          :research-native:assembleDebug
          :test-apps:external-vpn-fixture:lintDebug
          :test-apps:external-vpn-fixture:testDebugUnitTest
          :test-apps:external-vpn-fixture:assembleDebug
          :test-apps:managed-profile-controller:lintDebug
          :test-apps:managed-profile-controller:testDebugUnitTest
          :test-apps:managed-profile-controller:assembleDebug
          :test-apps:managed-profile-probe:lintTenantADebug
          :test-apps:managed-profile-probe:assembleTenantADebug
          :test-apps:managed-profile-probe:lintTenantBDebug
          :test-apps:managed-profile-probe:assembleTenantBDebug
          :test-apps:managed-profile-probe:testTenantADebugUnitTest
          :test-apps:managed-profile-probe:testTenantBDebugUnitTest
        working-directory: android
      - name: Verify release manifest remains network-free
        working-directory: android
        run: |
          ./gradlew --no-daemon :app:processReleaseMainManifest
          manifest=app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
          python3 tools/verify-release-manifest.py "$manifest"
          test "$(stat -c '%a' gradlew)" = 755
          echo 'Release manifest has no networking research capability'

  containment-prototype:
    needs: changes
    if: needs.changes.outputs.containment == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify wrapper JAR
        run: echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check
        working-directory: android
      - name: Install pinned toolchain and API 35 x86_64 emulator
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Free space for the disposable Android userdata image
        # Hosted runners include a large unused .NET SDK. Android tests need its disk space.
        run: sudo rm -rf -- /usr/share/dotnet
      - name: Enable KVM for the runner
        run: sudo chmod a+rw /dev/kvm
      - name: Run controlled containment instrumentation
        working-directory: android
        run: bash tools/run-containment-emulator.sh

  network-feasibility:
    needs: changes
    if: needs.changes.outputs.network == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify wrapper JAR
        run: echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check
        working-directory: android
      - name: Install pinned toolchain and API 35 x86_64 emulator
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Free space for the disposable Android userdata image
        # Hosted runners include a large unused .NET SDK. Android tests need its disk space.
        run: sudo rm -rf -- /usr/share/dotnet
      - name: Enable KVM for the runner
        run: sudo chmod a+rw /dev/kvm
      - name: Run independent network feasibility experiment
        working-directory: android
        run: bash tools/run-network-feasibility-emulator.sh

  managed-profile-feasibility:
    needs: changes
    if: needs.changes.outputs.managed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify wrapper JAR
        working-directory: android
        run: echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check
      - name: Install pinned toolchain and API 35 emulator
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Free space and enable KVM
        run: sudo rm -rf -- /usr/share/dotnet && sudo chmod a+rw /dev/kvm
      - name: Run managed-profile falsification experiment
        working-directory: android
        run: bash tools/run-managed-profile-feasibility-emulator.sh
