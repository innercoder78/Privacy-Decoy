name: Android Phase II foundation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      baseline: ${{ steps.classify.outputs.baseline }}
      analyzer: ${{ steps.classify.outputs.analyzer }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE_SHA: ${{ github.event.before }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          printf 'baseline=true\nanalyzer=true\n' >> "$GITHUB_OUTPUT"
          case "$EVENT_NAME" in pull_request) base=$PR_BASE_SHA;; push) base=$EVENT_BEFORE_SHA;; *) exit 0;; esac
          [[ "$base" =~ ^[0-9a-f]{40}$ && "$TESTED_SHA" =~ ^[0-9a-f]{40}$ && "$base" != 0000000000000000000000000000000000000000 ]] || exit 0
          paths=$(mktemp); git diff --name-only --diff-filter=ACDMRTUXB "$base" "$TESTED_SHA" > "$paths" || exit 0
          result=$(mktemp); .github/scripts/classify-ci-changes.sh < "$paths" > "$result" || exit 0
          cat "$result" >> "$GITHUB_OUTPUT"
  baseline:
    needs: changes
    if: needs.changes.outputs.baseline == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: {distribution: temurin, java-version: '17'}
      - name: Verify wrapper and executable modes
        working-directory: android
        run: |
          echo '497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
          test "$(stat -c '%a' gradlew)" = 755
          test "$(stat -c '%a' ../.github/scripts/classify-ci-changes.sh)" = 755
      - name: Install retained-module toolchain
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"'
      - name: Test retained independent packet analyzer
        run: python3 android/tools/test-network-evidence.py
      - name: Lint, test, and build active modules
        working-directory: android
        run: >-
          ./gradlew --no-daemon
          :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
          :probe-app:lintDebug :probe-app:testDebugUnitTest :probe-app:assembleDebug
          :research-native:lintDebug :research-native:testDebugUnitTest :research-native:assembleDebug
          :test-apps:external-vpn-fixture:lintDebug :test-apps:external-vpn-fixture:testDebugUnitTest :test-apps:external-vpn-fixture:assembleDebug
          :test-apps:java-surface-fixture:lintDebug :test-apps:java-surface-fixture:testDebugUnitTest :test-apps:java-surface-fixture:assembleDebug
          :test-apps:dynamic-code-surface-fixture:lintDebug :test-apps:dynamic-code-surface-fixture:testDebugUnitTest :test-apps:dynamic-code-surface-fixture:assembleDebug
          :test-apps:early-init-loader-fixture:lintDebug :test-apps:early-init-loader-fixture:testDebugUnitTest :test-apps:early-init-loader-fixture:assembleDebug
          :test-apps:early-init-loader-fixture:lintDynamic :test-apps:early-init-loader-fixture:assembleDynamic
          :test-apps:secondary-dex-fixture:lintDebug :test-apps:secondary-dex-fixture:testDebugUnitTest :test-apps:secondary-dex-fixture:assembleDebug
      - name: Verify release manifest properties
        working-directory: android
        run: |
          ./gradlew --no-daemon :app:processReleaseMainManifest
          python3 tools/verify-release-manifest.py app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
          ! find . -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.p12' \) -print -quit | grep -q .
  artifact-analyzer:
    needs: changes
    if: needs.changes.outputs.analyzer == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: {distribution: temurin, java-version: '17'}
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"'
      - run: python3 android/tools/test-artifact-analyzer.py
      - run: bash tools/run-artifact-fixtures.sh
        working-directory: android
